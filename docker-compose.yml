services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: expensetracker
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d expensetracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
