<div class="app-shell">
  <nav class="sidebar">
    <div class="sidebar-logo">E</div>

    <div class="sidebar-nav">
      @for (item of navItems; track item.path) {
        <a class="sidebar-nav-item" [routerLink]="item.path" routerLinkActive="active">
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </div>

    <div class="sidebar-footer">
      @let user = user$ | async;
      <button class="avatar-trigger" (click)="op.toggle($event)" aria-label="User menu">
        <div class="user-avatar">{{ avatarInitial(user) }}</div>
      </button>
      <p-popover #op styleClass="user-popover">
        <div class="popover-user-info">
          <div class="popover-name">{{ user?.name }}</div>
          <div class="popover-email">{{ user?.email }}</div>
        </div>
        <hr class="popover-divider" />
        <button class="logout-btn" (click)="logout()">
          <span class="logout-icon">→</span>
          Logout
        </button>
      </p-popover>
    </div>
  </nav>

  <main class="content-area">
    <router-outlet />
  </main>
</div>
