spring:
  application:
    name: expense-tracker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expensetracker}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  security:
    user:
      password: disabled

server:
  port: 8080
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:local-dev-secret-replace-in-production-min32chars}
  access-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
  refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.yourapp: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
